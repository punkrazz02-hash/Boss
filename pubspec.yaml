name: blackvault
description: "Premium personal finance and business management application. Build • Track • Grow"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  riverpod: ^2.4.10
  flutter_riverpod: ^2.4.10
  go_router: ^13.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  local_auth: ^2.1.14
  encrypt: ^4.0.4
  crypto: ^3.0.3
  fl_chart: ^0.65.0
  intl: ^0.19.0
  uuid: ^4.0.0
  image_picker: ^1.0.5
  permission_handler: ^11.4.4
  audio_session: ^0.1.16
  just_audio: ^0.9.35
  shared_preferences: ^2.2.2
  confetti: ^0.7.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  glassmorphism: ^3.0.0
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^5.0.0
  firebase_crashlytics: ^3.4.0
  firebase_analytics: ^10.7.0
  animations: ^2.0.10
  lottie: ^2.7.0
  vector_math: ^2.1.4
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logos/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
